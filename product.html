<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المنتج | HD Star</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
    <script src="product.js" defer type="module"></script>

</head>

<body>

    <header class="header">
        <nav class="navbar">

            <a href="index.html" class="logo">
                HD <span>Star</span>
            </a>

            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="products.html">المنتجات</a>
                <a href="index.html#about">من نحن</a>
                <a href="index.html#contact">اتصل بنا</a>
            </div>

            <a href="cart.html" class="cart">
                السلة
            </a>
            <button class="menu-btn">
                ☰
            </button>

        </nav>
    </header>


    <main>

        <section class="product-details">

            <div class="product-gallery">
                <div class="main-image"><img src="" alt="" id="mainProductImage"></div>
                <div class="thumbnail-list" id="thumbnail-list"></div>
            </div>


            <div class="product-info">

                <p class="product-category" id="product-category">جارٍ التحميل...</p>
                <h1 id="product-name">جارٍ تحميل المنتج</h1>
                <p class="product-price" id="product-price">—</p>
                <p class="product-description" id="product-description"></p>


                <div class="quantity">

                    <label for="quantity">
                        الكمية
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1"
                    >

                </div>


                <button class="add-cart-btn" id="addCartBtn" disabled>
                    أضف إلى السلة
                </button>

                <p class="product-message" id="product-message" aria-live="polite"></p>

            </div>

        </section>

    </main>


</body>

</html>
